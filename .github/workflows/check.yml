name: Rust checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --no-fail-fast
      # The web guide's generated regions must match the binary, catalog and example sources.
      - if: runner.os == 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - if: runner.os == 'Linux'
        run: cargo build --locked
      - if: runner.os == 'Linux'
        run: python scripts/test-build-site.py
      - if: runner.os == 'Linux'
        run: python scripts/build-site.py --check --binary target/debug/framechord
