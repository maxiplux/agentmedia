name: Native packages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'build.rs'
      - 'Cargo.*'
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'scripts/**'
      - 'docs/site/install.*'
      - '.github/workflows/release.yml'
      - '.github/workflows/package.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check Windows bootstrap prerequisites
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os, subprocess
          clean = {k: v for k, v in os.environ.items() if k.upper() != 'PSMODULEPATH'}
          subprocess.run(['powershell.exe', '-NoProfile', '-NonInteractive', '-Command', '$ErrorActionPreference="Stop"; Get-Command Get-FileHash, Invoke-WebRequest | Select-Object Name'], env=clean, check=True)
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Build and verify isolated native package
        run: python scripts/package-release.py --offline
      - uses: actions/upload-artifact@v7
        with:
          name: mediaagent-${{ matrix.os }}
          path: target/package-dist/*
          if-no-files-found: error
