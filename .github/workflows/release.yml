name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check Windows bootstrap prerequisites
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os, subprocess
          clean = {k: v for k, v in os.environ.items() if k.upper() != 'PSMODULEPATH'}
          subprocess.run(['powershell.exe', '-NoProfile', '-NonInteractive', '-Command', '$ErrorActionPreference="Stop"; Get-Command Get-FileHash, Invoke-WebRequest | Select-Object Name'], env=clean, check=True)
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: python scripts/package-release.py --offline
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: target/package-dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: target/release-downloads
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate native packages and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py --tag "$GITHUB_REF_NAME" --artifacts target/release-downloads
  acceptance:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify the public installer, update and offline rollback in isolation
        shell: bash
        run: python scripts/accept-release.py --version "$GITHUB_REF_NAME"
