# Offline init: mediaagent init ./project --defaults-file project-config.yaml --json
# These are explicit example choices, not a promise of account/model access.
# Select from `mediaagent models --json`; adjust before initialization.
schema_version: 2
defaults:
  image: {provider: google, model: gemini-nano-banana-2.1}
  infographic: {provider: google, model: gemini-nano-banana-2.1}
  speech: {provider: google, model: gemini-3.8-flash-tts}
  podcast: {provider: google, model: gemini-3.8-flash-tts}
  music: {provider: google, model: lyria-3.5}
  # Optional sound effects require ELEVENLABS_API_KEY:
  # sfx: {provider: elevenlabs, model: eleven_text_to_sound_v2}
  text: {provider: google, model: gemini-3.8-flash}
default_settings:
  image: {format: png}
  infographic: {format: png}
  speech: {format: wav, voice: Kore}
  podcast: {format: wav, voice: Kore}
  music: {format: mp3, duration_seconds: 60, instrumental: true}
  # sfx: {format: mp3, duration_seconds: 3}
default_locales:
  speech: en-US
  podcast: en-US
consistency:
  # Known identity originals always pin provider + model, regardless of this flag.
  # Also require metadata for imported identity images with unknown generation history.
  require_known_identity_model: true
  inherit_source_settings: true
limits:
  requests: 20
  images: 8
  audio_seconds: 1800
  speech_chars: 60000
  revisions: 3
  attempts: 3
  concurrency: 4
  per_provider: 2
